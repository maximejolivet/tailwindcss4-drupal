# Theme Tailwind CSS
theme:
  css:
    layout:
      dist/css/main.css: { weight: 50, media: "screen" }
  js:
    dist/js/theme.js: { }
  dependencies:
    - core/drupal
    - core/once

# Vite
hot-module-replacement:
  header: true
  js:
    # Vite HMR
    /@vite/client: { type: external, attributes: { type: "module" } }
    # Initial CSS entrypoint (Tailwind + tokens)
    /src/css/main.css: { attributes: { type: "module" } }
